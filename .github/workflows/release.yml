name: Release

# Runs when you push a tag like v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # needed to create a GitHub Release and upload assets

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-

      - name: Build release binary (static CRT)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release

      - name: Rename binary to include version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item target\release\lyra.exe "lyra-$tag-x86_64-windows.exe"

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          name: "Lyra ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: lyra-${{ github.ref_name }}-x86_64-windows.exe
