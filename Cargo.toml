[package]
name = "lyra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
directories = "5"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Control"] }
windows-future = "0.3"

[build-dependencies]
slint-build = "1"
